name: daily-docs-update
on:
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC (staggered: cloudflare 02:00, copilotkit 03:00)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-docs-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
      - name: Incremental update (new + stale + blocked-page repair)
        run: python3 update_incremental.py --concurrency 4
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ README.md guide_code/README.md
          git diff --cached --quiet && echo "no changes" || (git commit -m "chore: daily docs update $(date -u +%F)" && (git push || (git fetch origin main && (git rebase origin/main || (git checkout --ours -- docs/_last_verified.json docs/_manifest.json && git add -u && GIT_EDITOR=true git rebase --continue)) && git push)))
      - name: Corpus integrity audit (fails on blocked/404/relative-image pages)
        run: python3 audit_corpus.py
